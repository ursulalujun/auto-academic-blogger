interface:
  display_name: "Xiaohongshu Publisher"
  short_description: "Publish one already-prepared Xiaohongshu image note from Safari"
  default_prompt: "Use $xiaohongshu-image-note-publisher only for the final Xiaohongshu publish step from the user's normal logged-in Safari creator page. Assume the title, body, cover image, optional extra image, and cover text decision were already prepared with $xiaohongshu-post-preparer. For single-paper analysis posts, pass the original paper title, check the split single-paper logs before publishing to avoid duplicates, and register the post after success. Validate title <= 20 chars and body <= 1000 chars, upload the prepared assets in order, click 发布, and only report success if the final URL contains published=true."
